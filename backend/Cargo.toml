[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "~0.15"

tracing = "~0.1"
tracing-subscriber = { version = "~0.3", features = ["env-filter"] }

tokio = { version = "~1.54", features = ["full"] }

anyhow = "~1.0"
thiserror = "~2.0"

serde = { version = "~1.0", features = ["derive"] }

time = { version = "~0.3", features = ["macros", "serde"] }

uuid = { version = "~1.29", features = ["v7", "serde"] }
sqlx = { version = "~0.9", features = [
    "runtime-tokio",
    "postgres",
    "derive",
    "macros",
    "migrate",
    "uuid",
    "time",
] }

axum = "~0.8"

tower-http = { version = "~0.7", features = ["trace"] }

regex = "~1.13"
validator = { version = "~0.21", features = ["derive"] }

rand = "~0.10"
sha2 = "~0.11"
base64 = "~0.23"
argon2 = "~0.6"
